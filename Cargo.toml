[package]
name = "hdr"
version = "2026.11.15"
edition = "2024"
description = "Toggle Windows HDR per-display from the command line"
license = "MIT"
repository = "https://github.com/GrzegorzKozub/hdr"

[[bin]]
name = "hdr"
path = "src/main.rs"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Devices_Display",
] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
