[package]
name = "hdr"
version = "0.1.0"
edition = "2021"
description = "Toggle Windows HDR per-display from the command line"
license = "MIT"

[[bin]]
name = "hdr"
path = "src/main.rs"

[dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Devices_Display",
] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
